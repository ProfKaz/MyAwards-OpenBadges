name: Build Open Badges 2.0 images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - build.py
      - docs/assets/ms102.png
      - .github/workflows/build-badges.yml

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate hosted assertions and baked PNGs
        run: python build.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Open Badges 2.0 artifacts"
            git push
          fi
